name: fwamesh

services:
  corescope:
    image: ghcr.io/kpa-clawbot/corescope:v3.17.0
    container_name: fwamesh-corescope
    restart: unless-stopped
    environment:
      TZ: America/Indiana/Indianapolis
      DISABLE_CADDY: "true"        # Pangolin will terminate TLS at go-live
      DISABLE_MOSQUITTO: "false"   # bundled broker, anonymous on 1883
      GOMEMLIMIT: 768MiB
    ports:
      - "8090:3000"   # CoreScope web UI / API / websocket (Caddy disabled -> app port directly)
      - "1883:1883"   # MQTT for observers (meshcoretomqtt)
    volumes:
      - ./corescope-data:/app/data
      # Generated by overrides/build-supervisord-override.sh (adds -poll-ms 250). Rerun it after image upgrades.
      - ./overrides/supervisord-no-caddy.conf:/etc/supervisor/conf.d/supervisord-no-caddy.conf:ro
      # Generated by overrides/build-corescope-index.sh (adds the Umami tracker). Rerun it after image upgrades.
      - ./overrides/corescope-index.html:/app/public/index.html:ro
    dns: [1.1.1.1, 8.8.8.8]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  landing:
    image: nginx:1.27-alpine
    container_name: fwamesh-landing
    restart: unless-stopped
    environment:
      TZ: America/Indiana/Indianapolis
    ports:
      - "8091:80"
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      - ./landing-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./landing-umami-proxy.conf:/etc/nginx/umami-proxy.conf:ro

  # Ranks the channels observers hear (last 7 days) for the landing page. Reads CoreScope's API only.
  channel-stats:
    image: python:3.12-alpine
    container_name: fwamesh-channel-stats
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "-u", "/app/channel_stats.py"]
    environment:
      TZ: America/Indiana/Indianapolis
      CORESCOPE_API: http://corescope:3000
      OUT: /out/channels.json
      INTERVAL: "600"
    volumes:
      - ./stats/channel_stats.py:/app/channel_stats.py:ro
      - ./landing/data:/out
    depends_on:
      - corescope

  # Visitor analytics (https://umami.is). Privacy-friendly: no cookies, no personal data.
  # Dashboard on :8092 (stats.<domain>). The landing page sends visits through its own nginx at /u/.
  umami:
    image: ghcr.io/umami-software/umami:3.5.0
    container_name: fwamesh-umami
    restart: unless-stopped
    init: true
    environment:
      TZ: America/Indiana/Indianapolis
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?set in .env}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set in .env}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_2FA_KEY:?set in .env}
      # Reverse proxies (the TLS proxy and the landing nginx) are on private networks; skip them to find the visitor's IP.
      TRUSTED_PROXIES: private
      DISABLE_TELEMETRY: "1"
    ports:
      - "8092:3000"
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/heartbeat >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  umami-db:
    image: postgres:16-alpine
    container_name: fwamesh-umami-db
    restart: unless-stopped
    environment:
      TZ: America/Indiana/Indianapolis
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set in .env}
    volumes:
      - ./umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
