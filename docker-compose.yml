name: fwamesh

services:
  corescope:
    image: ghcr.io/kpa-clawbot/corescope:v3.17.0
    container_name: fwamesh-corescope
    restart: unless-stopped
    environment:
      TZ: America/Indiana/Indianapolis
      DISABLE_CADDY: "true"        # Pangolin will terminate TLS at go-live
      DISABLE_MOSQUITTO: "false"   # bundled broker, anonymous on 1883
      GOMEMLIMIT: 768MiB
    ports:
      - "8090:3000"   # CoreScope web UI / API / websocket (Caddy disabled -> app port directly)
      - "1883:1883"   # MQTT for observers (meshcoretomqtt)
    volumes:
      - ./corescope-data:/app/data
      # Generated by overrides/build-supervisord-override.sh (adds -poll-ms 250). Rerun it after image upgrades.
      - ./overrides/supervisord-no-caddy.conf:/etc/supervisor/conf.d/supervisord-no-caddy.conf:ro
    dns: [1.1.1.1, 8.8.8.8]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  landing:
    image: nginx:1.27-alpine
    container_name: fwamesh-landing
    restart: unless-stopped
    environment:
      TZ: America/Indiana/Indianapolis
    ports:
      - "8091:80"
    volumes:
      - ./landing:/usr/share/nginx/html:ro

  # Ranks the channels observers hear (last 7 days) for the landing page. Reads CoreScope's API only.
  channel-stats:
    image: python:3.12-alpine
    container_name: fwamesh-channel-stats
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "-u", "/app/channel_stats.py"]
    environment:
      TZ: America/Indiana/Indianapolis
      CORESCOPE_API: http://corescope:3000
      OUT: /out/channels.json
      INTERVAL: "600"
    volumes:
      - ./stats/channel_stats.py:/app/channel_stats.py:ro
      - ./landing/data:/out
    depends_on:
      - corescope
