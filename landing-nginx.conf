# Landing page site. Pages, CSS, JS and data revalidate on every visit (cheap 304s via ETag),
# so edits show up immediately; images are cached for a week.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        add_header Cache-Control "no-cache" always;
    }
    # Umami analytics, first-party: only the tracker script and the collect endpoint are exposed here.
    # Docker's DNS resolves "umami" lazily, so nginx still starts if Umami is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    location = /u/script.js { set $u umami:3000; proxy_pass http://$u/script.js; include /etc/nginx/umami-proxy.conf; }
    location = /u/api/send  { set $u umami:3000; proxy_pass http://$u/api/send;  include /etc/nginx/umami-proxy.conf; }

    location /img/ {
        add_header Cache-Control "public, max-age=604800" always;
    }
}
