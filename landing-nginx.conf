# Landing page site. Pages, CSS, JS and data revalidate on every visit (cheap 304s via ETag),
# so edits show up immediately; images are cached for a week.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        add_header Cache-Control "no-cache" always;
    }
    location /img/ {
        add_header Cache-Control "public, max-age=604800" always;
    }
}
